services:
  db:
    image: postgres:16-alpine
    container_name: botica_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-botica_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - botica_net

  backend:
    build: ./backend
    container_name: botica_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin123}@db:5432/${POSTGRES_DB:-botica_db}
      SECRET_KEY: ${SECRET_KEY:-cambiar_este_secreto_en_produccion_botica_jwt_2026}
    depends_on:
      - db
    networks:
      - botica_net

  frontend:
    build: ./frontend
    container_name: botica_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    networks:
      - botica_net

volumes:
  pgdata:

networks:
  botica_net:
    driver: bridge
